databaseChangeLog:
  - changeSet:
      id: ddl-tables-001
      author: contreras-elkin
      labels: "HU-PLAT-004,ddl,tables"
      comment: "product - what a producer offers. Soft delete with deleted_at (D-C5). No foreign keys here, they go in 04_alter."
      changes:
        - sqlFile:
            path: 001_create_product.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_product.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
