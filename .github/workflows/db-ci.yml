name: Database rebuild

# The whole changelog must build the catalog schema from an EMPTY instance, apply
# nothing on a second run, give catalog_app write access only to its own schema
# (Anexo J.10), revert entirely and build again (norm §5.2.8, ADR-011).

on:
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_DATABASE: market_agri
  PG_ADMIN_USER: market_admin
  PG_ADMIN_PASSWORD: ci-only

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine          # same image as market-agri-infra
        env:
          POSTGRES_DB: market_agri
          POSTGRES_USER: market_admin
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U market_admin -d market_agri"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the instance as market-agri-infra would (01-instance.sh)
        run: |
          psql() {
            docker run --rm -i --network host -e PGPASSWORD="$PG_ADMIN_PASSWORD" postgres:16-alpine \
              psql -v ON_ERROR_STOP=1 -h localhost -U "$PG_ADMIN_USER" -d "$PG_DATABASE" "$@"
          }
          psql -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -c "CREATE ROLE catalog_app LOGIN PASSWORD 'ci-only';"
          psql -c "ALTER ROLE catalog_app SET search_path = catalog;"

      - name: Apply, check isolation, roll everything back, apply again
        run: |
          lb() {
            docker run --rm --network host -v "$PWD:/workspace:ro" liquibase/liquibase:4.29 \
              --search-path=/workspace --changelog-file=changelog/changelog-master.yaml \
              --url="jdbc:postgresql://localhost:5432/$PG_DATABASE" \
              --username="$PG_ADMIN_USER" --password="$PG_ADMIN_PASSWORD" \
              --database-changelog-table-name=databasechangelog_catalog \
              --database-changelog-lock-table-name=databasechangeloglock_catalog "$@"
          }
          psql() {
            docker run --rm -i --network host -e PGPASSWORD="$PG_ADMIN_PASSWORD" postgres:16-alpine \
              psql -v ON_ERROR_STOP=1 -h localhost -U "$PG_ADMIN_USER" -d "$PG_DATABASE" "$@"
          }

          echo "::group::1. update from empty"
          lb update
          echo "::endgroup::"

          echo "::group::2. second update must apply nothing"
          lb update | tee second.txt
          grep -q "Run:  *0" second.txt || { echo "second update applied changes: not incremental"; exit 1; }
          echo "::endgroup::"

          echo "::group::3. J.10: catalog_app writes only in catalog"
          psql -At -F '|' < .github/workflows/j10-privileges.sql | tee privileges.txt
          if grep -E '^catalog_app\|' privileges.txt | grep -vE '^catalog_app\|catalog\|' | grep -q '|t$'; then
            echo "catalog_app can write outside the catalog schema"; exit 1
          fi
          echo "::endgroup::"

          echo "::group::4. full rollback leaves nothing of the domain"
          lb rollback-count 999
          left=$(psql -At -c "SELECT (SELECT count(*) FROM pg_namespace WHERE nspname = 'catalog')
                                   + (SELECT count(*) FROM pg_roles WHERE rolname IN ('catalog_reader','catalog_writer'));")
          [ "$left" = "0" ] || { echo "rollback left the schema or the roles behind"; exit 1; }
          echo "::endgroup::"

          echo "::group::5. update again after the rollback"
          lb update
          echo "::endgroup::"
