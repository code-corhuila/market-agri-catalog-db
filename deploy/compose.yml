# Only the migration runner of the catalog schema. The PostgreSQL instance, its
# volume and the catalog_app user live in market-agri-infra (Anexo J.1, J.7):
# this file is valid only when market-agri-infra includes it (decision D-11).
#
# From market-agri-infra:
#   docker compose --env-file env/dev.env run --rm catalog-db-migrate
#   docker compose --env-file env/dev.env run --rm catalog-db-migrate rollback-count 1

services:
  catalog-db-migrate:
    image: liquibase/liquibase:4.29
    profiles: [tooling]                  # never starts with `up`: migrating is a deliberate act
    depends_on:
      postgres:                          # defined in market-agri-infra
        condition: service_healthy
    volumes:
      - ../:/workspace:ro
    # Connection flags live in the entrypoint so that `run … <subcommand>` only
    # replaces the Liquibase command (update, rollback-count, status…).
    entrypoint: ["liquibase",
      "--search-path=/workspace",
      "--changelog-file=changelog/changelog-master.yaml",
      "--url=jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}",
      "--username=${PG_ADMIN_USER:?set PG_ADMIN_USER}",
      "--password=${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD}",
      "--database-changelog-table-name=databasechangelog_catalog",
      "--database-changelog-lock-table-name=databasechangeloglock_catalog"]
    command: ["update"]
    networks: [platform]

networks:
  platform:
    name: platform-${ENV:?set ENV}
    external: true
